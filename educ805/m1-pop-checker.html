<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problem of practice check · EDUC 805 Module 1</title>
<style>
  :root { --red:#A6192E; --red-d:#7A1222; --red-t:#FCEBEB; --blue:#9BCBEB; --blue-d:#0C447C; --blue-t:#EAF4FB;
          --ink:#222; --muted:#5F5E5A; --line:#DCDFE3; --ok-t:#E7F4EC; }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#fff; }
  h1 { font:bold 20px/1.3 Georgia,serif; color:var(--red-d); margin:0 0 4px; }
  .lead { margin:0 0 10px; color:var(--muted); font-size:14.5px; }
  .panel[hidden] { display:none; }
  .card { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .stmt { font-weight:600; margin:0 0 8px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; font-size:14.5px; padding:6px 14px; border-radius:18px; border:1.5px solid var(--blue-d); background:#fff; color:var(--blue-d); cursor:pointer; }
  button:hover:not(:disabled) { background:var(--blue-t); }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
  button:disabled { cursor:default; opacity:.55; }
  button.picked { opacity:1; background:var(--blue-d); color:#fff; }
  .fb { margin:8px 0 0; font-size:14.5px; padding:8px 10px; border-radius:8px; display:none; }
  .fb.show { display:block; } .fb.right { background:var(--ok-t); } .fb.wrong { background:var(--red-t); }
  label.big { display:block; font-weight:600; margin:0 0 6px; }
  textarea { width:100%; font:inherit; font-size:15px; padding:10px; border:1px solid var(--line); border-radius:8px; resize:vertical; }
  .q { border:1px solid var(--line); border-radius:10px; padding:8px 14px; margin-bottom:8px; }
  .q legend { font-weight:600; padding:0 4px; }
  .q .help { font-size:14px; color:var(--muted); margin:0 0 4px; }
  .opts { display:flex; gap:16px; flex-wrap:wrap; font-size:15px; }
  .opts label { cursor:pointer; }
  .primary { background:var(--red); border-color:var(--red); color:#fff; padding:8px 18px; }
  .primary:hover:not(:disabled) { background:var(--red-d) !important; }
  .out { display:none; margin-top:12px; border:1px solid var(--blue); background:var(--blue-t); border-radius:10px; padding:12px 14px; }
  .out.show { display:block; }
  .out textarea { background:#fff; min-height:170px; font-size:14px; }
  .note { font-size:13.5px; color:var(--muted); margin:6px 0 0; }
  .msg { font-size:14px; color:var(--red-d); margin:6px 0 0; min-height:1em; }
</style>
</head>
<body>

<!-- Quick check: used on Key topic 2 -->
<section class="panel" id="part-a">
  <h1>Is it a problem of practice?</h1>
  <p class="lead">Three made-up examples. Ready to be a problem of practice, or not yet?</p>
  <div id="listA"></div>
</section>

<!-- Own problem: used (optionally) in Task 3, opened with #part-b -->
<section class="panel" id="part-b" hidden>
  <h1>Test your own problem</h1>
  <p class="lead">Your text stays in this browser window. Nothing is saved or sent, so copy your summary before you leave.</p>
  <label class="big" for="myprob">Your problem from Task 1 (two or three sentences)</label>
  <textarea id="myprob" rows="3"></textarea>
  <div id="qs" style="margin-top:10px;"></div>
  <button type="button" class="primary" id="go">Make my summary</button>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div class="out" id="out" aria-live="polite">
    <p style="margin:0 0 6px;"><strong>Your summary.</strong> Paste it into your journal.</p>
    <textarea id="summary" readonly aria-label="Your summary"></textarea>
    <div class="btns" style="margin-top:8px;"><button type="button" id="copy">Copy summary</button></div>
    <p class="note" id="copied" aria-live="polite"></p>
  </div>
</section>

<script>
const A = [
  { s:"Our district's test scores are low.", a:"no",
    why:"Not yet. Important, but broad: which students, grades, or subjects? Low scores are often a symptom. Module 2 digs into causes." },
  { s:"For three years, about a third of our 9th graders have failed Algebra I in the first semester, and few recover the credit.", a:"yes",
    why:"Yes. Persistent (three years), local (our 9th graders), specific (a number and a course), and worth improving." },
  { s:"State funding formulas are unfair to rural districts.", a:"no",
    why:"Not yet. Possibly real, but mostly outside a practitioner's reach. Look for the local piece you can influence." },
];
const listA = document.getElementById('listA');
A.forEach((it, i) => {
  const c = document.createElement('div'); c.className = 'card';
  c.innerHTML = `<p class="stmt" id="a${i}">${i+1}. ${it.s}</p>
    <div class="btns" role="group" aria-labelledby="a${i}">
      <button type="button" data-k="yes">Problem of practice</button>
      <button type="button" data-k="no">Not yet</button></div>
    <div class="fb" aria-live="polite"></div>`;
  c.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const ok = b.dataset.k === it.a;
    c.querySelectorAll('button').forEach(x => x.disabled = true);
    b.classList.add('picked');
    const fb = c.querySelector('.fb');
    fb.className = 'fb show ' + (ok ? 'right' : 'wrong');
    fb.textContent = (ok ? '' : 'Worth another look. ') + it.why;
  }));
  listA.appendChild(c);
});

const Q = [
  { k:"Persistent", q:"Does it happen again and again?", tip:"Note when it has happened before: last year, last term, every spring." },
  { k:"Local", q:"Can you name where it happens and who is involved?", tip:"Name the place and people: which school, program, grade, or office." },
  { k:"Specific", q:"Could you point to an example or a number?", tip:"Add one example, or one number you already see in your role." },
  { k:"Within reach", q:"Is some of it within your influence?", tip:"Find the piece you or your team could act on." },
  { k:"Worth improving", q:"Would working on it help real people?", tip:"Say who is most affected, or least well served right now." },
];
const LV = { yes:"Yes", partly:"Partly", no:"Not yet" };
const qs = document.getElementById('qs');
Q.forEach((it, i) => {
  const f = document.createElement('fieldset'); f.className = 'q';
  f.innerHTML = `<legend>${i+1}. ${it.k}</legend><p class="help">${it.q}</p>
    <div class="opts">${Object.entries(LV).map(([v,l]) => `<label><input type="radio" name="q${i}" value="${v}"> ${l}</label>`).join('')}</div>`;
  qs.appendChild(f);
});
document.getElementById('go').addEventListener('click', () => {
  const prob = document.getElementById('myprob').value.trim();
  const ans = Q.map((_, i) => (document.querySelector(`input[name=q${i}]:checked`) || {}).value);
  const msg = document.getElementById('msg');
  if (!prob) { msg.textContent = 'Add your problem first.'; return; }
  if (ans.some(a => !a)) { msg.textContent = 'Answer all five checks first.'; return; }
  msg.textContent = '';
  const work = Q.map((q, i) => ({ q, a: ans[i] })).filter(x => x.a !== 'yes');
  let t = 'My problem (Task 1): ' + prob + '\n\n';
  t += 'Five checks: ' + Q.map((q, i) => `${q.k} ${LV[ans[i]]}`).join(' | ') + '\n\n';
  t += work.length ? 'To sharpen:\n' + work.map(x => `- ${x.q.k}: ${x.q.tip}`).join('\n') : 'All five checks look strong.';
  t += '\n\nMy problem now (2-3 sentences): ';
  document.getElementById('summary').value = t;
  document.getElementById('out').className = 'out show';
  document.getElementById('copied').textContent = '';
});
document.getElementById('copy').addEventListener('click', async () => {
  const ta = document.getElementById('summary'), note = document.getElementById('copied');
  try { await navigator.clipboard.writeText(ta.value); note.textContent = 'Copied.'; }
  catch (e) { ta.focus(); ta.select();
    try { document.execCommand('copy'); note.textContent = 'Copied.'; }
    catch (e2) { note.textContent = 'Your summary is selected. Press Ctrl+C (Cmd+C on a Mac) to copy it.'; } }
});
if (location.hash === '#part-b') { document.getElementById('part-a').hidden = true; document.getElementById('part-b').hidden = false; }
</script>
</body>
</html>
