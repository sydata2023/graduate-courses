<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which qualitative design? · EDUC 805 Module 4</title>
<style>
  :root { --red:#A6192E; --red-d:#7A1222; --red-t:#FCEBEB; --blue:#9BCBEB; --blue-d:#0C447C; --blue-t:#EAF4FB;
          --ink:#222; --muted:#5F5E5A; --line:#DCDFE3; --ok-t:#E7F4EC; }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#fff; }
  h1 { font:bold 20px/1.3 Georgia,serif; color:var(--red-d); margin:0 0 4px; }
  .lead { margin:0 0 10px; color:var(--muted); font-size:14.5px; }
  .card { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .card.done { border-left:5px solid var(--blue-d); }
  .stmt { font-weight:600; margin:0 0 8px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; font-size:14px; padding:6px 12px; border-radius:18px; border:1.5px solid var(--blue-d); background:#fff; color:var(--blue-d); cursor:pointer; }
  button:hover:not(:disabled) { background:var(--blue-t); }
  button:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
  button:disabled { cursor:default; opacity:.55; }
  button.picked { opacity:1; background:var(--blue-d); color:#fff; }
  .fb { margin:8px 0 0; font-size:14.5px; padding:8px 10px; border-radius:8px; display:none; }
  .fb.show { display:block; } .fb.right { background:var(--ok-t); } .fb.wrong { background:var(--red-t); }
  .fb strong { display:block; margin-bottom:2px; }
</style>
</head>
<body>
<h1>Which qualitative design?</h1>
<p class="lead">Five questions about the same problem. Which design fits each one best?</p>
<div id="list"></div>
<script>
const D = { cs:"Case study", ph:"Phenomenology", na:"Narrative", gt:"Grounded theory", et:"Ethnography" };
const ITEMS = [
  { s:"How did our new 9th-grade advisory program unfold in its first year, from the views of staff, students, and families?", a:"cs",
    why:"One bounded program, studied in depth from several angles and data sources, is a case study." },
  { s:"What is it like for a 9th grader to return to school after missing several weeks?", a:"ph",
    why:"Describing the shared lived experience of a phenomenon across several people is phenomenology." },
  { s:"What are the life stories of two students who went from chronic absence to graduation?", a:"na",
    why:"Telling and interpreting individual stories over time is narrative research." },
  { s:"What process do 9th graders go through as they slowly stop coming to school?", a:"gt",
    why:"Building an explanation (a theory) of a process from the data is grounded theory." },
  { s:"How do the shared routines and unwritten rules of our 9th-grade hallway shape who shows up?", a:"et",
    why:"Studying the shared culture of a group, often through long observation, is ethnography." },
];
const list = document.getElementById('list');
ITEMS.forEach((it, i) => {
  const c = document.createElement('div'); c.className = 'card';
  c.innerHTML = `<p class="stmt" id="s${i}">${i+1}. ${it.s}</p>
    <div class="btns" role="group" aria-labelledby="s${i}">
      ${Object.entries(D).map(([k,l]) => `<button type="button" data-k="${k}">${l}</button>`).join('')}
    </div><div class="fb" aria-live="polite"></div>`;
  c.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const ok = b.dataset.k === it.a;
    c.querySelectorAll('button').forEach(x => x.disabled = true);
    b.classList.add('picked'); c.classList.add('done');
    const fb = c.querySelector('.fb');
    fb.className = 'fb show ' + (ok ? 'right' : 'wrong');
    fb.innerHTML = `<strong>${ok ? 'Yes.' : 'Not quite. Best fit: ' + D[it.a] + '.'}</strong>${it.why}`;
  }));
  list.appendChild(c);
});
</script>
</body>
</html>
