<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ed.D., PhD, or both? · EDUC 805 Module 1</title>
<style>
  :root { --red:#A6192E; --red-d:#7A1222; --red-t:#FCEBEB; --blue:#9BCBEB; --blue-d:#0C447C; --blue-t:#EAF4FB;
          --ink:#222; --muted:#5F5E5A; --line:#DCDFE3; --ok-t:#E7F4EC; }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#fff; }
  h1 { font:bold 20px/1.3 Georgia,serif; color:var(--red-d); margin:0 0 4px; }
  .lead { margin:0 0 10px; color:var(--muted); font-size:14.5px; }
  .progress { font-size:13.5px; color:var(--muted); margin-bottom:8px; }
  .card { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .card.done { border-left:5px solid var(--blue-d); }
  .stmt { font-weight:600; margin:0 0 8px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; font-size:14.5px; padding:6px 14px; border-radius:18px; border:1.5px solid var(--blue-d); background:#fff; color:var(--blue-d); cursor:pointer; }
  button:hover:not(:disabled) { background:var(--blue-t); }
  button:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
  button:disabled { cursor:default; opacity:.55; }
  button.picked { opacity:1; background:var(--blue-d); color:#fff; }
  .fb { margin:8px 0 0; font-size:14.5px; padding:8px 10px; border-radius:8px; display:none; }
  .fb.show { display:block; } .fb.right { background:var(--ok-t); } .fb.wrong { background:var(--red-t); }
  .fb strong { display:block; margin-bottom:2px; }
  .summary { display:none; border:1px solid var(--blue); background:var(--blue-t); border-radius:10px; padding:12px 14px; }
  .summary.show { display:block; }
  .reset { border-color:var(--red); color:var(--red); margin-top:8px; }
</style>
</head>
<body>
<h1>Ed.D., PhD, or both?</h1>
<p class="lead">Choose where each statement fits best. These are general tendencies; programs vary.</p>
<div class="progress" id="progress" aria-live="polite"></div>
<div id="list"></div>
<div class="summary" id="summary" aria-live="polite"></div>
<script>
const ITEMS = [
  { s:"Starts from a persistent problem in the student's own workplace.", a:"edd",
    why:"A Dissertation in Practice begins with a local problem of practice, not a gap in the literature." },
  { s:"Starts from a gap in the research literature or a need to refine theory.", a:"phd",
    why:"Traditional PhD research is usually driven by what the field does not yet know." },
  { s:"Uses careful, systematic inquiry and draws on published research.", a:"both",
    why:"Both degrees are rigorous. The difference is purpose, not quality." },
  { s:"Mainly prepares people for careers in research, grants, and university teaching.", a:"phd",
    why:"That is the typical aim of a PhD. Ed.D. graduates usually stay in practice and lead change." },
  { s:"Ends with a dissertation.", a:"both",
    why:"Both do: the Ed.D. with a Dissertation in Practice, the PhD with a traditional dissertation." },
];
const LABEL = { edd:"Ed.D.", phd:"PhD", both:"Both" };
let answered = 0, correct = 0;
function render() {
  answered = 0; correct = 0;
  const list = document.getElementById('list'); list.innerHTML = '';
  document.getElementById('summary').className = 'summary';
  ITEMS.forEach((it, i) => {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<p class="stmt" id="s${i}">${i+1}. ${it.s}</p>
      <div class="btns" role="group" aria-labelledby="s${i}">
        ${['edd','phd','both'].map(k => `<button type="button" data-k="${k}">${LABEL[k]}</button>`).join('')}
      </div><div class="fb" aria-live="polite"></div>`;
    card.querySelectorAll('button').forEach(b => b.addEventListener('click', () => choose(card, it, b)));
    list.appendChild(card);
  });
  progress();
}
function choose(card, it, btn) {
  const ok = btn.dataset.k === it.a;
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  btn.classList.add('picked'); card.classList.add('done');
  const fb = card.querySelector('.fb');
  fb.className = 'fb show ' + (ok ? 'right' : 'wrong');
  fb.innerHTML = `<strong>${ok ? 'Yes.' : 'Not quite. Best fit: ' + LABEL[it.a] + '.'}</strong>${it.why}`;
  answered++; if (ok) correct++; progress();
  if (answered === ITEMS.length) finish();
}
function progress() { document.getElementById('progress').textContent = `${answered} of ${ITEMS.length} done`; }
function finish() {
  const s = document.getElementById('summary'); s.className = 'summary show';
  s.innerHTML = `<p style="margin:0 0 6px;"><strong>You matched ${correct} of ${ITEMS.length}.</strong></p>
    <p style="margin:0;">Takeaway: both degrees are rigorous. They differ in where the work starts (a problem in practice or a gap in the literature) and what it is for (improving practice or adding to theory).</p>
    <button type="button" class="reset" id="again">Try again</button>`;
  document.getElementById('again').addEventListener('click', () => { render(); window.scrollTo(0,0); });
}
render();
</script>
</body>
</html>
